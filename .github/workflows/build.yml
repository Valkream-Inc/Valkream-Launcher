name: Launcher Build

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/**"
  # Build à blanc : compile les installeurs Windows et les expose en artefact, SANS créer de release.
  # Onglet Actions → Launcher Build → Run workflow (sur n'importe quelle branche).
  workflow_dispatch:

concurrency:
  group: launcher-build
  cancel-in-progress: false

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.create_release.outputs.skip }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=$(jq -r .version frontend/package.json)" >> $GITHUB_OUTPUT

      # Version attendue : SemVer (ex : 3.0.0 ou 3.0.0-beta.1). Un avertissement seulement : le format
      # historique « beta-3.0.0 » n'est pas du SemVer et n'a jamais été validé par electron-builder / electron-updater.
      - name: Check version format
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::warning title=Version non SemVer::'$VERSION' n'est pas une version SemVer (ex : 3.0.0-beta.1) : electron-updater peut refuser de la comparer."
          fi

      # Idempotent : une release déjà publiée pour cette version n'est ni recréée ni reconstruite
      # (pour publier, incrémenter la version de frontend/package.json).
      - name: Create release (if missing)
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release existante::La release $VERSION existe déjà : build ignoré. Incrémentez la version pour publier."
          else
            flags=""
            case "$VERSION" in *beta*|*alpha*) flags="--prerelease" ;; esac
            gh release create "$VERSION" --repo "$REPO" --title "release $VERSION" --notes "Launcher $VERSION" $flags
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-launcher:
    needs: create-release
    if: github.event_name == 'push' && needs.create-release.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]
        # Désactivations du cross plateforme pour le momment.
        # os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      # Yarn 4 (Berry) via corepack, APRÈS setup-node : le shim doit appartenir au Node 22 installé
      # (avec `cache: yarn` dans setup-node, c'est le yarn 1 global qui était résolu → échec packageManager).
      - name: Enable Corepack
        run: corepack enable

      - name: Yarn cache dir
        id: yarn-cache
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: ./

      - name: Tests
        run: yarn workspace Valkream-Launcher test
        working-directory: ./

      - name: Typecheck
        run: yarn typecheck
        working-directory: ./

      - name: Build Electron launcher
        run: yarn run build
        working-directory: ./frontend
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

  # Build à blanc (déclenchement manuel) : mêmes étapes que le build réel, mais rien n'est publié
  # (DRY_RUN → electron-builder `publish: never`, pas de token). Les installeurs sont à télécharger
  # dans l'artefact « launcher-dry-run » pour être testés sur une machine Windows.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: ./

      - name: Tests
        run: yarn workspace Valkream-Launcher test
        working-directory: ./

      - name: Typecheck
        run: yarn typecheck
        working-directory: ./

      - name: Build Electron launcher (sans publication)
        run: yarn run build
        working-directory: ./frontend
        env:
          DRY_RUN: "true"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: launcher-dry-run
          path: |
            frontend/dist/*.exe
            frontend/dist/*.blockmap
            frontend/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  download-global:
    name: Combine & Upload All Artifacts
    needs: [create-release, build-launcher]
    if: github.event_name == 'push' && needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        run: |
          gh release download ${{ needs.create-release.outputs.version }} \
            --repo ${{ github.repository }} \
            --dir ./release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: List downloaded files
        run: ls -lh ./release-assets

      - name: Create platform-specific zips
        run: |
          cd release-assets

          echo "🧹 Nettoyage des anciens .zip..."
          find . -type f -name '*.zip' -delete

          echo "📦 Création des archives d'installation..."
          zip -r ../combined-install-win.zip . -i '*-install-win*'
          zip -r ../combined-install-linux.zip . -i '*-install-linux*'
          zip -r ../combined-install-mac.zip . -i '*-install-mac*'

          echo "📦 Création des archives de mise à jour..."
          # Windows (inclut latest.yml)
          zip -r ../combined-update-win.zip . -i '*-update-win*' 'latest.yml'

          # Linux (inclut latest-linux.yml)
          zip -r ../combined-update-linux.zip . -i '*-update-linux*' 'latest-linux.yml'

          # Mac (inclut latest-mac.yml)
          zip -r ../combined-update-mac.zip . -i '*-update-mac*' 'latest-mac.yml'

          echo "✅ Zips générés :"
          ls -lh ../*.zip
        shell: bash

      # --clobber : un second passage remplace les zips au lieu d'échouer
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          # Cross-plateforme désactivé pour le moment : seuls les zips Windows sont publiés.
          # (Ajouter combined-install-{linux,mac}.zip et combined-update-{linux,mac}.zip à leur réactivation.)
          gh release upload "$VERSION" ./combined-install-win.zip ./combined-update-win.zip \
            --repo "${{ github.repository }}" --clobber
