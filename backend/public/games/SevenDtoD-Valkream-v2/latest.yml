# Instance SevenDtoD-Valkream-v2 — canal stable.
# Les gros fichiers (zips, dossiers `files/`) sont hébergés sur le serveur, sous /games/<jeu>/latest/ (hors dépôt).
#
# NORME DE VERSIONNAGE : X0.X1.X2 (affichage seulement)
#   X0 saison · X1 game-base · X2 game-details
# Le niveau d'une mise à jour se décide entrée par entrée (version + hash), pas sur cette chaîne.
#
# Deux niveaux, tous deux forcés (le jeu n'est jouable en ligne que si tout est à jour) :
#   game-base      le jeu lui-même : réinstallation complète si en retard
#   game-details   mods, configuration, détails : mise à jour incrémentale
#
# Chaque entrée (le nom de l'entrée est la clé qui relie au dossier d'installation du main).
# TOUTES les options sauf `version` peuvent :
#   - être déclinées par plateforme : { win32: …, linux: …, darwin: …, default: … } ;
#   - prendre une valeur inline, ou un lien (/chemin relatif au serveur de fichiers, ou https://…)
#     vers un fichier JSON/YAML qui contient la valeur (une chaîne qui commence par « / » est donc
#     un lien : écrire les chemins sans « / » initial).
#   Une entrée dont type ou content n'a pas de valeur pour la plateforme n'est pas proposée dessus.
#   Exceptions : content (zip), hash-folder et api-url sont déjà des liens vers ce que télécharge
#   le provider ; seule leur plateforme est choisie.
#
#   version   indique si elle doit être mise à jour
#   (pas de `path` : le dossier d'installation de chaque entrée est décidé par le launcher,
#    dans la config main `entryPaths`, jamais par le remote)
#   type      zip_url | hash_url | thunderstore_modpack_url | nexus_modpack_url
#   hash      sha256 du manifeste des fichiers de l'entrée (généré par `yarn build:manifest`)
#   content   lien, liste, ou manifeste inline
#   hash-folder / zip / api-url / folder_in_zip   selon le type (voir la doc) ;
#                                           zip = archive de tous les fichiers d'un hash_url (installation complète)
#   optional  { setting } : installée seulement si ce réglage d'instance est actif
#   gameFolderToRemove     relatifs au dossier de l'entrée, supprimés à la mise à jour de l'entrée
#   gameFolderToPreserve   fichiers/dossiers relatifs au dossier de l'entrée conservés à la mise à jour (config client…).
#                          "chemin" = toujours ; { path, from } = seulement si la version INSTALLÉE
#                          satisfait `from` (>=1.2.0, >=1.0.0 <2.0.0, 1.x, *) : la config du joueur
#                          est encore compatible. Sinon la nouvelle version l'écrase.
#   to_ignore              motifs relatifs au dossier de l'entrée (*, **, ?) exclus du hash, de la vérification et du
#                          nettoyage : fichiers locaux que l'entrée ne possède pas (logs, caches…)

version: 1.0.0
buildDate: 2025-07-03T19:20:08.929Z

game-base:
  sevendtod:
    version: 0.220.5
    type: zip_url
    content:
      win32: https://play.valkream.com/games/SevenDtoD/latest/build-game-win32.zip
      linux: https://play.valkream.com/games/SevenDtoD/latest/build-game-linux.zip
      darwin: https://play.valkream.com/games/SevenDtoD/latest/build-game-darwin.zip

game-details:
  modpack:
    version: 1.0.0
    type: hash_url
    content: https://play.valkream.com/games/SevenDtoD/latest/mods.json
    hash-folder: https://play.valkream.com/games/SevenDtoD/latest/files/Mods/
