# `type: empty` = entrée réservée, qui ne télécharge rien : à remplacer par un vrai type
# (zip_url, hash_url, thunderstore_modpack_url…) dès que son contenu est publié.
# Une entrée sans type ou sans contenu est ignorée.

version: 3.0.0
buildDate: 2026-11-26T00:00:00.000Z

game-base:
  valheim:
    version: 1.0.30
    type: steam_library
    buildid: 26948984 # Patch 1.0.30 (26 November 2026 – 14:05:59 UTC)
    content:
      win32: /games/Valheim-Valkream-v3/beta/latest/hash/valheim-1.0.30-win32.hash.json
      linux: /games/Valheim-Valkream-v3/beta/latest/hash/valheim-1.0.30-linux.hash.json
      darwin: /games/Valheim-Valkream-v3/beta/latest/hash/valheim-1.0.30-darwin.hash.json
    hash:
      win32: 51bfdd79365a8bdb7a9df97b0aa8a90cbe0e236c3833d6744bee97d2f2423573
      linux: ca9e8cde440c219440d224c02e14c5cae9f3f8850caaa5266e1c60c033a31081
      darwin: 75811034c9c6589807992de061fff067fa189753fb0e1c960510bb7777f97a76
