      win32: { id: 892972, manifest: "3007837673982863752" } # 892972 = Valheim Windows
      linux: { id: 892971, manifest: "853228340114251592" } # 892971 = Valheim Linux
      darwin: { id: 892973, manifest: "4903160343930100355" } # 892973 = Valheim macOS
